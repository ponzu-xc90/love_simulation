<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>めんどくさい彼ゲーム</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
  background: #fff5fb;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
  overflow: hidden;
}

#app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  max-height: 750px;
  background: #fff5fb;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}

@media (max-width: 430px) {
  #app {
    max-height: 100dvh;
    box-shadow: none;
  }
}

/* =====================
   Opening Screen
===================== */
#opening {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #fff0f8;
  padding: 36px 20px 28px;
  min-height: 100vh;
}

.opening-love-game-label {
  font-size: 11px;
  color: #d090b0;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

#opening h1 {
  font-size: 24px;
  font-weight: 700;
  color: #8b3070;
  text-align: center;
  line-height: 1.3;
  margin-bottom: 4px;
}

.opening-subtitle {
  font-size: 11px;
  color: #c07090;
  margin-bottom: 24px;
}

.opening-character-img {
  width: 200px;
  border-radius: 12px;
  margin-bottom: 28px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.btn-start {
  width: 100%;
  background: #e8a8c8;
  border: none;
  border-radius: 24px;
  padding: 13px;
  font-size: 14px;
  color: #6b2040;
  font-weight: 700;
  font-family: inherit;
  text-align: center;
  cursor: pointer;
}

/* =====================
   Chat Screen
===================== */
#chat-screen {
  display: none;
  flex-direction: column;
  height: 100vh;
}

.chat-header {
  background: #e8b8d8;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.chat-header-icon {
  width: 36px;
  height: 36px;
  background: #c87ab0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.chat-header-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.chat-header-name {
  font-size: 12px;
  font-weight: 600;
  color: #6b2560;
  letter-spacing: 0.02em;
}

.chat-header-status {
  font-size: 9px;
  color: #c87ab0;
  font-weight: 400;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  background: #fff5fb;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
  min-height: 0;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  animation: fadeInUp 0.25s ease;
}

.message-row.him {
  justify-content: flex-start;
}

.message-row.me {
  justify-content: flex-end;
}

.msg-icon {
  width: 28px;
  height: 28px;
  background: #c87ab0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #fff;
  font-weight: 700;
  flex-shrink: 0;
}

.bubble {
  max-width: 88%;
  padding: 9px 12px;
  word-break: break-word;
  letter-spacing: 0.01em;
}

.him .bubble {
  background: #ffffff;
  border: 1.5px solid #f0c0dc;
  border-radius: 18px 18px 18px 4px;
  color: #8b3070;
  font-size: 14px;
  line-height: 1.5;
}

.me .bubble {
  background: #e8a8c8;
  border-radius: 18px 18px 4px 18px;
  color: #fff;
  font-size: 14px;
  line-height: 1.5;
}

.read-marker {
  font-size: 10px;
  color: #c87ab0;
  flex-shrink: 0;
  align-self: flex-end;
  margin-bottom: 2px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =====================
   Choices Area
===================== */
.choices-area {
  background: #fdeef7;
  padding: 12px 10px;
  display: none;
  flex-direction: column;
  flex-shrink: 0;
  border-top: 1.5px solid #f0c0dc;
  position: sticky;
  bottom: 0;
}

.choices-label {
  color: #c07090;
  font-size: 11px;
  text-align: center;
  margin-bottom: 8px;
}

.choice-btn {
  background: #ffffff;
  border: 1.5px solid #e8a8cc;
  border-radius: 20px;
  color: #a04080;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 400;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.12s;
  text-align: center;
  margin-bottom: 6px;
  line-height: 1.4;
}

.choice-btn:last-child {
  margin-bottom: 0;
}

.choice-btn:active {
  background: #fde0f0;
}

/* =====================
   Game Over Screen
===================== */
#gameover-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: #ffffff;
  padding: 40px 24px;
  text-align: center;
}

.gameover-title {
  font-size: 22px;
  font-weight: 500;
  color: #222;
  letter-spacing: 5px;
  white-space: nowrap;
  margin-bottom: 16px;
}

.gameover-divider {
  width: 32px;
  height: 1px;
  background: #ccc;
  margin-bottom: 20px;
}

.gameover-reason-text {
  font-size: 13px;
  color: #333;
  line-height: 1.9;
  text-align: center;
  margin-bottom: 32px;
  width: 100%;
}

.btn-retry-go {
  width: 100%;
  border: 1px solid #222;
  background: none;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: #222;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 8px;
}

.btn-share-go {
  width: 100%;
  border: 1px solid #ccc;
  background: none;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: #999;
  font-family: inherit;
  cursor: pointer;
}

/* =====================
   Clear Screen
===================== */
#clear-screen {
  display: none;
  flex-direction: column;
  height: 100%;
  background: #fff9f5;
  overflow-y: auto;
}

.clear-top {
  background: #fff9f5;
  padding: 20px 14px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.clear-svg-wrap {
  margin-bottom: 12px;
}

.clear-congrats-label {
  color: #c07090;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.clear-title {
  color: #7a2050;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.clear-subtitle {
  color: #d080b0;
  font-size: 10px;
}

.clear-body {
  padding: 10px 16px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}

.clear-message-box {
  background: #fde8f2;
  border-radius: 12px;
  padding: 10px 14px;
  width: 100%;
  color: #a04070;
  font-size: 12px;
  line-height: 1.8;
}

.clear-rate-num {
  color: #e060a0;
  font-size: 30px;
  font-weight: 700;
}

.clear-rate-sub {
  color: #c07090;
  font-size: 9px;
  margin-top: 2px;
}

.btn-retry-cl {
  width: 100%;
  background: #e8a8c8;
  border: none;
  border-radius: 22px;
  padding: 11px;
  font-size: 12px;
  color: #6b2040;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
}

.btn-share-cl {
  width: 100%;
  border: 2px solid #e8a8c8;
  border-radius: 22px;
  background: none;
  padding: 11px;
  font-size: 12px;
  color: #c06090;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
}
</style>
</head>
<body>
<div id="app">

  <!-- Opening -->
  <div id="opening">
    <div class="opening-love-game-label">LOVE GAME</div>
    <h1>めんどくさい彼ゲーム</h1>
    <p class="opening-subtitle">デートの約束を取り付けろ！</p>
    <img src="character.png" alt="キャラクター" class="opening-character-img">
    <button class="btn-start" onclick="startGame()">ゲームスタート</button>
  </div>

  <!-- Chat -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="chat-header-icon">彼</div>
      <div class="chat-header-info">
        <div class="chat-header-name">かれし</div>
        <div class="chat-header-status">オンライン</div>
      </div>
    </div>
    <div class="chat-area" id="chat-area"></div>
    <div class="choices-area" id="choices-area"></div>
  </div>

  <!-- Game Over -->
  <div id="gameover-screen">
    <div class="gameover-title">GAME OVER</div>
    <div class="gameover-divider"></div>
    <div class="gameover-reason-text" id="gameover-reason"></div>
    <button class="btn-retry-go" onclick="resetGame()">もう一回</button>
    <button class="btn-share-go" id="gameover-share-btn">X でシェア</button>
  </div>

  <!-- Clear -->
  <div id="clear-screen">
    <div class="clear-top">
      <div class="clear-svg-wrap">
        <svg width="160" height="110" viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="80" cy="95" rx="28" ry="8" fill="#e8c870" opacity="0.3"/>
          <rect x="74" y="68" width="12" height="32" rx="4" fill="#c8a850"/>
          <rect x="76" y="70" width="8" height="28" rx="3" fill="#d4b860"/>
          <circle cx="80" cy="52" r="22" fill="#f0c0d8"/>
          <circle cx="60" cy="58" r="16" fill="#f8d0a8"/>
          <circle cx="100" cy="58" r="16" fill="#c8e0b0"/>
          <circle cx="68" cy="42" r="14" fill="#d8b8f0"/>
          <circle cx="92" cy="42" r="14" fill="#f0e0a0"/>
          <circle cx="80" cy="36" r="13" fill="#f0c0d8"/>
          <circle cx="80" cy="52" r="10" fill="#e8a0c0"/>
          <circle cx="60" cy="58" r="7" fill="#f0c080"/>
          <circle cx="100" cy="58" r="7" fill="#a0d090"/>
          <circle cx="68" cy="42" r="6" fill="#c090e0"/>
          <circle cx="92" cy="42" r="6" fill="#e8d080"/>
          <circle cx="80" cy="36" r="6" fill="#e8a0c0"/>
          <circle cx="80" cy="52" r="4" fill="#fff" opacity="0.6"/>
          <circle cx="60" cy="58" r="3" fill="#fff" opacity="0.6"/>
          <circle cx="100" cy="58" r="3" fill="#fff" opacity="0.6"/>
        </svg>
      </div>
      <div class="clear-congrats-label">CONGRATULATIONS</div>
      <div class="clear-title">おめでとう！</div>
      <div class="clear-subtitle">デートの約束ができました</div>
    </div>
    <div class="clear-body">
      <div class="clear-message-box">めんどくさい彼とのやり取りを完璧にこなしました</div>
      <div>
        <div class="clear-rate-num">0.046%</div>
        <div class="clear-rate-sub">クリア率（めちゃくちゃ難しい）</div>
      </div>
      <button class="btn-retry-cl" onclick="resetGame()">もう一回</button>
      <button class="btn-share-cl" onclick="shareClearOnX()">X でシェア</button>
    </div>
  </div>

</div>

<script>
const scenes = {
  1: {
    messages: [
      { text: "今週末、予定入ってないし暇なんだよなぁ", delay: 576 },
      { text: "マジでやることない", delay: 384 }
    ],
    choices: [
      { text: "そうなんだ", result: "next", next: 2 },
      {
        text: "私も暇だよ!",
        result: "gameover",
        responses: ["そうですか。", "おつかれしたー。"],
        blocked: true,
        reason: "彼は急激に興味を失くしたようです。そんな彼を責めないでください。"
      },
      {
        text: "映画でも見に行かない?",
        result: "gameover",
        responses: ["俺タイタニックもう見たから。", "おつかれしたー。"],
        blocked: true,
        reason: "彼にとってはタイタニックがすべてのようでした。タイタニックは名作です。"
      }
    ]
  },
  2: {
    messages: [
      { text: "そうなんだよ。", delay: 576 },
      { text: "あー、暇。", delay: 384 },
      { text: "誰か遊びに誘ってくれねーかなぁ?", delay: 384 }
    ],
    choices: [
      { text: "何かしたいことあるの?", result: "next", next: 3 },
      {
        text: "私も予定空いてるよ!",
        result: "gameover",
        responses: ["そうですか。", "おつかれしたー。"],
        blocked: false,
        reason: "彼は猛烈に興味を失くしてしまいました。意味分からないですよね。"
      },
      {
        text: "誰かいたら良いね!",
        result: "gameover",
        responses: [],
        blocked: false,
        readIgnore: true,
        reason: "彼は拗ねちゃいました。そういうお年頃なのです。"
      }
    ]
  },
  3: {
    messages: [
      { text: "んー、特には?", delay: 576 },
      { text: "でも、何かしたいんだよねぇ", delay: 384 }
    ],
    choices: [
      { text: "その答え、私知ってるよ。", result: "next", next: 4 },
      {
        text: "じゃあ、私が提案してあげる!",
        result: "gameover",
        responses: ["いや、結構っす。", "おつかれしたー。"],
        blocked: true,
        reason: "せっかく提案してあげたのに意味の分からない奴ですね。そんな奴こっちから願い下げですね。"
      },
      {
        text: "カフェでも行かない?",
        result: "gameover",
        responses: ["俺、水か牛乳しか飲まねーから。", "おつかれしたー。"],
        blocked: true,
        reason: "そういう男も世の中には存在するみたいです。"
      }
    ]
  },
  4: {
    messages: [
      { text: "ふっ、おもしれー女。", delay: 576 },
      { text: "聞かせてもらおうじゃねーか、その答え。", delay: 384 }
    ],
    choices: [
      { text: "(返信しない)", result: "next", next: 5, silent: true },
      {
        text: "教えなーい!",
        result: "gameover",
        responses: ["そうですか。"],
        blocked: true,
        reason: "ここでの焦らしは彼に通用しませんでした。"
      },
      {
        text: "私とデートしたらいいじゃん!",
        result: "gameover",
        responses: [
          "バ、バカヤロー!!!",
          "そ、そんなつもりで言ったんじゃねーし!!",
          "勘違いすんなよな!!",
          "あーーー、もう!!!"
        ],
        blocked: true,
        reason: "彼はかなりシャイだったので、ブロックしちゃいました。"
      }
    ]
  },
  5: {
    messages: [
      { text: "...", delay: 960 },
      { text: "おーい", delay: 576 },
      { text: "返信ないんだけど", delay: 384 }
    ],
    choices: [
      { text: "焦らしちゃった...! てへ!", result: "next", next: 6 },
      {
        text: "(さらに返信しない)",
        result: "gameover",
        silent: true,
        responses: ["なんなんだよ!", "もう!"],
        blocked: false,
        reason: "既読無視は可哀想です。返信してあげましょう。"
      },
      {
        text: "ほら、君自身が答え持ってるじゃん!",
        result: "gameover",
        responses: ["は?", "意味わかんね、怖っ。"],
        blocked: true,
        reason: "あまり変なこと言うと嫌われちゃいます。注意しましょう!"
      }
    ]
  },
  6: {
    messages: [
      { text: "は? 何?", delay: 576 },
      { text: "可愛いじゃん。", delay: 384 },
      { text: "まじで", delay: 384 }
    ],
    choices: [
      { text: "ねぇ! 週末映画行かない?", result: "next", next: 7 },
      {
        text: "ねぇ! 週末水族館行かない?",
        result: "gameover",
        responses: ["俺、実家水族館だから。", "パス"],
        blocked: true,
        reason: "彼のプロフィールは事前に調べておきましょう。"
      },
      {
        text: "ねぇ! 週末うちに来ない?",
        result: "gameover",
        responses: [
          "さすがにいきなり家に行くというのはいかがなものかな?",
          "僕も男だから下心はないと言えば嘘になるが。",
          "さすがに順序というものを弁えているつもりなのだが。",
          "これは僕の頭が堅すぎるのかな? いや、そんなことはないだろう。",
          "非常に申し訳ないが、そのお誘いは乗れないな。",
          "不純異性交友と言うべきか?",
          "僕は僕を大切にする。",
          "君ももう少し自分を大切にしたらどうだろうか?"
        ],
        blocked: true,
        reason: "彼の何かに火をつけてしまったようです。"
      }
    ]
  },
  7: {
    messages: [
      { text: "映画?", delay: 576 },
      { text: "ふっ。", delay: 384 },
      { text: "タイタニック、俺もう見たぜ?", delay: 384 }
    ],
    choices: [
      {
        text: "タイタニックは何度見ても最高だよ!",
        result: "gameover",
        responses: ["いや、それはない。", "2回で十分だよ。"],
        blocked: true,
        reason: "あと少し! 惜しい! タイタニックを買い被りすぎましたね。"
      },
      {
        text: "いいから! コナン見に行くよ!",
        result: "clear",
        responses: ["バーロー!", "真実はいつも一つとは限らねぇんだぜ!!"]
      },
      {
        text: "タイタニックって古いよ! w 何か新しい映画観ようよ!",
        result: "gameover",
        responses: [],
        blocked: false,
        readIgnore: true,
        reason: "ここへ来てなぜか彼の気が変わってしまいました。恋愛は難しいですね。"
      }
    ]
  }
};

let currentScene = 1;
let chatArea, choicesArea;
let isProcessing = false;

function showScreen(id) {
  document.querySelectorAll('#app > div').forEach(d => d.style.display = 'none');
  document.getElementById(id).style.display = 'flex';
}

function startGame() {
  chatArea = document.getElementById('chat-area');
  choicesArea = document.getElementById('choices-area');
  chatArea.innerHTML = '';
  choicesArea.innerHTML = '';
  currentScene = 1;
  showScreen('chat-screen');
  playScene(currentScene);
}

function resetGame() {
  showScreen('opening');
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addHisMessage(text) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'message-row him';
    row.innerHTML = '<div class="msg-icon">彼</div><div class="bubble">' + escapeHtml(text) + '</div>';
    chatArea.appendChild(row);
    scrollToBottom();
    resolve();
  });
}

function addMyMessage(text) {
  const row = document.createElement('div');
  row.className = 'message-row me';
  row.innerHTML = '<div class="read-marker">既読</div><div class="bubble">' + escapeHtml(text) + '</div>';
  chatArea.appendChild(row);
  scrollToBottom();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function playScene(sceneNum) {
  isProcessing = true;
  choicesArea.innerHTML = '';
  choicesArea.style.display = 'none';
  const scene = scenes[sceneNum];

  for (const msg of scene.messages) {
    await wait(msg.delay);
    await addHisMessage(msg.text);
    await wait(1000);
  }

  isProcessing = false;
  showChoices(scene.choices);
}

function showChoices(choices) {
  choicesArea.innerHTML = '<div class="choices-label">どう返す？</div>';
  choices.forEach((choice) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.onclick = () => selectChoice(choice);
    choicesArea.appendChild(btn);
  });
  choicesArea.style.display = 'flex';
}

async function selectChoice(choice) {
  if (isProcessing) return;
  isProcessing = true;
  choicesArea.innerHTML = '';
  choicesArea.style.display = 'none';

  if (!choice.silent) {
    addMyMessage(choice.text);
    await wait(1000);
  }

  if (choice.result === 'next') {
    currentScene = choice.next;
    await wait(288);
    playScene(currentScene);
  } else if (choice.result === 'gameover') {
    await playGameOver(choice);
  } else if (choice.result === 'clear') {
    await playClear(choice);
  }
}

async function playGameOver(choice) {
  if (choice.readIgnore) {
    const row = document.createElement('div');
    row.className = 'message-row him';
    row.innerHTML = '<div class="msg-icon">彼</div><div class="bubble" style="color:#b898c0;font-style:italic;">(既読無視)</div>';
    chatArea.appendChild(row);
    scrollToBottom();
    await wait(720);
  } else {
    for (const msg of choice.responses) {
      await wait(480);
      await addHisMessage(msg);
      await wait(96);
    }
  }

  await wait(384);
  await wait(2000);

  document.getElementById('gameover-reason').textContent = choice.reason;

  const shareBtn = document.getElementById('gameover-share-btn');
  shareBtn.onclick = () => shareGameOverOnX(choice.reason);

  showScreen('gameover-screen');
}

async function playClear(choice) {
  for (const msg of choice.responses) {
    await wait(480);
    await addHisMessage(msg);
    await wait(96);
  }

  await wait(576);
  showScreen('clear-screen');
}

function shareGameOverOnX(reason) {
  const text = "ゲームオーバーしました 理由: " + reason + " めんどくさい彼ゲーム https://ponzu-xc90.github.io/love_simulation/ #めんどくさい彼ゲーム";
  const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
  window.open(url, '_blank');
}

function shareClearOnX() {
  const text = "クリアしました！ めんどくさい彼とのデートの約束を取り付けました！クリア率0.046%の超難関ゲーム めんどくさい彼ゲーム https://ponzu-xc90.github.io/love_simulation/ #めんどくさい彼ゲーム";
  const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
  window.open(url, '_blank');
}
